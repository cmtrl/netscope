[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmtrl-netscope"
version = "1.1.0"
description = "A Python CLI for checking DNS records, TCP ports, and HTTP headers"
authors = [{name = "Ayoub Alshammari"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["aiohttp>=3.14.5,<4.0", "dnspython>=2.9.2,<3.0", "rich>=13.9.4,<15.0"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.urls]
"GitHub profile" = "https://github.com/cmtrl"
Repository = "https://github.com/cmtrl/netscope"
Issues = "https://github.com/cmtrl/netscope/issues"
Documentation = "https://github.com/cmtrl/netscope/blob/main/docs/REFERENCE.md"

[project.scripts]
netscope = "netscope.cli:main"
netscope-demo = "netscope.demo:main"

[tool.setuptools.packages.find]
include = ["netscope*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
